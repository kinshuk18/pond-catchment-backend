# The institute exposes all four student systems through one gateway IP,
# assigning one application port to each system. Deploy identical backend
# copies on 3293--3296 and run this Nginx gateway on stu24_sys1.

upstream pond_backend {
    server 10.1.75.51:3293;  # stu24_sys1
    server 10.1.75.51:3294;  # stu24_sys2
    server 10.1.75.51:3295;  # stu24_sys3
    server 10.1.75.51:3296;  # stu24_sys4
}

server {
    listen 80;

    # static frontend (the frontend/ folder from this repo)
    location / {
        root /var/www/pond-frontend;
        try_files $uri $uri/ /index.html;
    }

    # backend API, load-balanced across the four systems
    location /api/ {
        proxy_pass http://pond_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;   # elevation+rainfall calls are the slow path
    }
}