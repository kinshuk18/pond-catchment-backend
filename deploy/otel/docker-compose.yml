services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - type: bind
        source: ./otel-collector-config.yaml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus metrics exporter
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - type: bind
        source: ./tempo-config.yaml
        target: /etc/tempo.yaml
        read_only: true
    ports:
      - "3200:3200" # Tempo HTTP query API

  prometheus:
    image: prom/prometheus:v2.53.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - type: bind
        source: ./prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - type: bind
        source: ./loki-config.yaml
        target: /etc/loki/local-config.yaml
        read_only: true
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - type: bind
        source: ./grafana-datasources.yaml
        target: /etc/grafana/provisioning/datasources/datasources.yaml
        read_only: true
      - type: bind
        source: ./grafana-dashboards.yaml
        target: /etc/grafana/provisioning/dashboards/dashboards.yaml
        read_only: true
      - type: bind
        source: ../../grafana/pond-otel-dashboard.json
        target: /etc/grafana/provisioning/dashboards/pond-otel-dashboard.json
        read_only: true
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
